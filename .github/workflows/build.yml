name: Build Fabric 26.3 Mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build JAR
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-of-mod-fabric-26.3
          path: |
            build/libs/mod-of-mod-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
